services:
  api:
    build:
      context: .
      dockerfile: apps/api/Dockerfile
    environment:
      NODE_ENV: production
      PORT: "4000"
      HOST: 0.0.0.0
      CORS_ORIGINS: http://localhost:3000
      DATABASE_FILE: /app/apps/api/data/portfolio.sqlite
      CONTACT_RATE_MAX: "5"
    volumes:
      - api_data:/app/apps/api/data
    ports:
      - "4000:4000"
    restart: unless-stopped

  web:
    build:
      context: .
      dockerfile: apps/web/Dockerfile
      args:
        # Browser-facing API URL (inlined at build time).
        NEXT_PUBLIC_API_URL: http://localhost:4000
    environment:
      NODE_ENV: production
      # Server-side fetches go container-to-container over the compose network.
      API_URL: http://api:4000
      HOSTNAME: 0.0.0.0
      PORT: "3000"
    ports:
      - "3000:3000"
    depends_on:
      - api
    restart: unless-stopped

volumes:
  api_data:
